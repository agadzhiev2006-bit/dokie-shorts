<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block}
text{font-family:"Inter Display","Inter";font-weight:900}</style></head><body>
<svg id="sv" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script src="man.js"></script>
<script>
const ORG="#ff8a1f",ORG2="#ffb347",TEAL="#14b8a6",TEAL2="#5eead4",YEL="#ffd23f",RED="#e5352b",GRN="#22c55e",INK="#0b0b0d";
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lin=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), bk=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const pop=(t,a,d=.35)=>bk(lin(t,a,a+d));
const SC=[[0,4.6,s0],[4.6,10.95,s1],[10.95,14.7,s2],[14.7,26.3,s3],[26.3,34.0,s4],[34.0,41.7,s5]];
const CAP=[[0,2.3,"TWO PEOPLE. SAME ~PAYCHECK~"],[2.3,4.6,"ONLY ONE GETS ~RICH~"],[4.6,7.3,"PERSON 1: MONEY ~HITS~"],[7.3,8.45,"NEW ~SHOES~"],[8.45,9.45,"DINNER ~OUT~"],[9.45,10.95,"\"I ~DESERVE~ IT\""],[10.95,12.0,"DAY ~10~"],[12.0,13.0,"HE'S ~BROKE~"],[13.0,14.7,"WAITING FOR NEXT MONTH"],[14.7,15.8,"PERSON ~2~"],[15.8,16.9,"SAME MONEY"],[16.9,17.9,"FIRST THING..."],[17.9,21.7,"~20%~ GOES TO SAVINGS"],[21.7,23.1,"THEN ~BILLS~"],[23.1,25.0,"IF SOMETHING'S LEFT..."],[25.0,26.3,"HE HAS ~FUN~"],[26.3,27.4,"SAME ~SALARY~"],[27.4,28.5,"SAME ~CITY~"],[28.5,29.9,"SAME ~AGE~"],[29.9,31.5,"ONE WORKS FOR ~MONEY~"],[31.5,34.0,"MONEY WORKS FOR ~HIM~"],[34.0,35.3,"WHICH ONE ARE ~YOU~?"],[35.3,37.0,"COMMENT ~1~ OR ~2~"],[37.0,41.7,"PART 2: ~10 YEARS~ LATER"]];
const BEATS=[0,2.35,4.6,7.35,8.5,9.47,10.95,12.06,14.7,17.93,21.77,25.1,26.38,27.4,28.56,29.94,31.55,34.1,35.31,38.03];
const ST={lean:0,tilt:0,b:[18,6],f:[-14,-6],lb:[-6,6],lf:[6,-6],bh:"open",fh:"open",ex:{}};
const P=o=>Object.assign({},ST,o,{ex:Object.assign({},o.ex||{})});
const POS={
 idle:P({}),
 cheer:P({b:[215,200],f:[140,165],bh:"open",fh:"open",tilt:-6,ex:{mouth:.8,brow:-6}}),
 point:P({f:[95,90],fh:"point",ex:{mouth:.4}}),
 thumb:P({f:[60,150],fh:"thumb",ex:{mouth:.6}}),
 sad:P({lean:6,tilt:14,b:[4,0],f:[-4,0],bh:"open",fh:"open",ex:{brow:12,brow2:-4,look:-6,lid:10}}),
 smug:P({f:[40,160],fh:"thumb",tilt:-4,ex:{lid:6,brow:4}}),
 think:P({f:[30,175],fh:"point",tilt:8,ex:{look:6,brow:-8}}),
 shrug:P({b:[240,270],f:[120,90],bh:"open",fh:"open",tilt:-10,ex:{brow:-10,mouth:.3}}),
};
function man(x,y,s,pose,t,flip=false,tint){const br=Math.sin(t*3.2)*6;
 const p=Object.assign({},pose,{bob:br});
 return `<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s}) translate(-540 -1665)">${manSVG(p)}</g>`}
function bg(c1,c2,t){return `<defs><radialGradient id="g${c1.slice(1)}" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="${c2}"/><stop offset="1" stop-color="${c1}"/></radialGradient></defs>
 <rect width="1080" height="1920" fill="url(#g${c1.slice(1)})"/>`+rays(t,c2)}
function rays(t,c){let s=`<g transform="translate(540 820) rotate(${t*8})" opacity=".18">`;for(let i=0;i<12;i++)s+=`<path d="M0 0 L-90 -1500 L90 -1500 Z" fill="#fff" transform="rotate(${i*30})"/>`;return s+"</g>"}
function badge(n,x,y,c,sc=1){return `<g transform="translate(${x} ${y}) scale(${sc})"><circle r="78" fill="${INK}" stroke="#fff" stroke-width="10"/><text y="34" text-anchor="middle" font-size="104" fill="${c}">${n}</text></g>`}
function card(x,y,sc,txt,c=GRN,rot=0){return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})"><rect x="-230" y="-95" width="460" height="190" rx="34" fill="#fff" stroke="${INK}" stroke-width="10"/><rect x="-230" y="-95" width="460" height="56" rx="28" fill="${c}"/><rect x="-230" y="-60" width="460" height="22" fill="${c}"/><text x="-200" y="-55" font-size="34" fill="#fff">PAYCHECK</text><text y="66" text-anchor="middle" font-size="96" fill="${INK}">${txt}</text></g>`}
function bubble(x,y,sc,txt,c="#fff"){return `<g transform="translate(${x} ${y}) scale(${sc})"><path d="M-250 -90 H250 Q290 -90 290 -50 V50 Q290 90 250 90 H-60 L-120 150 L-110 90 H-250 Q-290 90 -290 50 V-50 Q-290 -90 -250 -90Z" fill="${c}" stroke="${INK}" stroke-width="10"/><text y="26" text-anchor="middle" font-size="74" fill="${INK}">${txt}</text></g>`}
function sneaker(x,y,sc,r=0){return `<g transform="translate(${x} ${y}) rotate(${r}) scale(${sc})"><path d="M-150 30 Q-150 -60 -90 -70 Q-40 -72 -20 -30 Q40 -10 120 0 Q160 10 160 45 L160 60 H-150Z" fill="${RED}" stroke="${INK}" stroke-width="10" stroke-linejoin="round"/><path d="M-150 45 H160" stroke="#fff" stroke-width="14"/><path d="M-40 -40 L-10 -10 M-20 -50 L10 -20" stroke="#fff" stroke-width="8"/></g>`}
function plate(x,y,sc){return `<g transform="translate(${x} ${y}) scale(${sc})"><ellipse rx="160" ry="70" fill="#fff" stroke="${INK}" stroke-width="10"/><ellipse rx="100" ry="40" fill="${ORG2}" stroke="${INK}" stroke-width="6"/><path d="M-30 -20 Q0 -60 40 -18" stroke="${RED}" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M200 -60 V60 M180 -60 V-10 M220 -60 V-10" stroke="${INK}" stroke-width="10" stroke-linecap="round"/></g>`}
function coin(x,y,sc,r=0){return `<g transform="translate(${x} ${y}) rotate(${r}) scale(${sc})"><circle r="46" fill="${YEL}" stroke="${INK}" stroke-width="8"/><text y="22" text-anchor="middle" font-size="60" fill="${INK}">$</text></g>`}
function wallet(x,y,sc,open){return `<g transform="translate(${x} ${y}) scale(${sc})"><rect x="-180" y="-110" width="360" height="220" rx="30" fill="#7c4a2a" stroke="${INK}" stroke-width="10"/><rect x="60" y="-40" width="140" height="80" rx="20" fill="#5a3420" stroke="${INK}" stroke-width="8"/><circle cx="110" r="12" fill="${YEL}"/>${open?`<path d="M-120 -160 q20 -40 0 -80 M-60 -150 q20 -40 0 -80" stroke="#fff" stroke-width="8" fill="none" opacity=".7"/>`:""}</g>`}
function piggy(x,y,sc,fill){return `<g transform="translate(${x} ${y}) scale(${sc})"><ellipse rx="190" ry="150" fill="#ff9ec7" stroke="${INK}" stroke-width="10"/><path d="M-110 -120 L-80 -190 L-40 -135Z" fill="#ff9ec7" stroke="${INK}" stroke-width="10" stroke-linejoin="round"/><ellipse cx="185" cy="10" rx="45" ry="55" fill="#ff7fb2" stroke="${INK}" stroke-width="10"/><circle cx="175" cy="0" r="8" fill="${INK}"/><circle cx="195" cy="22" r="8" fill="${INK}"/><circle cx="110" cy="-50" r="14" fill="${INK}"/><rect x="-60" y="-160" width="120" height="20" rx="10" fill="${INK}"/><rect x="-120" y="120" width="50" height="70" rx="12" fill="#ff9ec7" stroke="${INK}" stroke-width="10"/><rect x="70" y="120" width="50" height="70" rx="12" fill="#ff9ec7" stroke="${INK}" stroke-width="10"/><text y="60" text-anchor="middle" font-size="64" fill="${INK}">${fill}</text></g>`}
function bill(x,y,sc,txt,r=0){return `<g transform="translate(${x} ${y}) rotate(${r}) scale(${sc})"><rect x="-120" y="-150" width="240" height="300" rx="16" fill="#fff" stroke="${INK}" stroke-width="10"/><text y="-80" text-anchor="middle" font-size="46" fill="${RED}">${txt}</text><path d="M-80 -20 H80 M-80 30 H80 M-80 80 H30" stroke="#bbb" stroke-width="14" stroke-linecap="round"/></g>`}
function bar(x,y,w,frac,c){return `<g transform="translate(${x} ${y})"><rect x="${-w/2}" y="-34" width="${w}" height="68" rx="34" fill="${INK}" opacity=".85"/><rect x="${-w/2+10}" y="-24" width="${Math.max(0,(w-20)*frac)}" height="48" rx="24" fill="${c}"/></g>`}
function calendar(x,y,sc,d){return `<g transform="translate(${x} ${y}) scale(${sc})"><rect x="-150" y="-150" width="300" height="300" rx="30" fill="#fff" stroke="${INK}" stroke-width="10"/><rect x="-150" y="-150" width="300" height="90" rx="30" fill="${RED}"/><rect x="-150" y="-90" width="300" height="30" fill="${RED}"/><text y="100" text-anchor="middle" font-size="170" fill="${INK}">${d}</text></g>`}
function burst(cx,cy,t,a,c=YEL,n=10){const p=lin(t,a,a+.5);if(p<=0||p>=1)return"";let s="";for(let i=0;i<n;i++){const an=i*36*Math.PI/180,r1=120+p*220,r2=r1+60*(1-p);s+=`<path d="M${cx+Math.cos(an)*r1} ${cy+Math.sin(an)*r1} L${cx+Math.cos(an)*r2} ${cy+Math.sin(an)*r2}" stroke="${c}" stroke-width="${16*(1-p)+2}" stroke-linecap="round"/>`}return s}
function confetti(t,a){if(t<a)return"";let s="";const p=t-a;for(let i=0;i<26;i++){const x=(i*137)%1080,y=-60+p*(500+(i%5)*90)+ (i*53%300),r=p*200*(i%2?1:-1)+i*20;const c=[YEL,RED,TEAL2,"#fff",ORG][i%5];s+=`<rect x="${x}" y="${y}" width="22" height="34" fill="${c}" transform="rotate(${r} ${x} ${y})"/>`}return s}
/* ---------- scenes ---------- */
function s0(t){let s=`<rect width="540" height="1920" fill="${ORG}"/><rect x="540" width="540" height="1920" fill="${TEAL}"/>`;
 s+=`<path d="M540 0 V1920" stroke="${INK}" stroke-width="14"/>`;
 const pz=t<2.35?POS.idle:POS.think;
 s+=man(270,1560,.62,t<2.35?POS.cheer:POS.shrug,t)+man(810,1560,.62,t<2.35?POS.idle:POS.smug,t,true);
 s+=badge(1,270,560,ORG,pop(t,.0))+badge(2,810,560,TEAL,pop(t,.1));
 const k=pop(t,0,.4);s+=card(540,330,.95*k,"$3,000",GRN,-4+Math.sin(t*2)*2);
 if(t>2.35){const q=pop(t,2.35,.4);s+=`<g transform="translate(810 760) scale(${q})"><text text-anchor="middle" font-size="160" fill="${YEL}" stroke="${INK}" stroke-width="12" paint-order="stroke">$$$</text></g>`;s+=burst(810,720,t,2.35)}
 return s}
function s1(t){const L=t-4.6;let s=bg(ORG,ORG2,t);
 const pz=t<7.35?POS.point:t<9.47?POS.cheer:POS.smug;
 s+=man(330,1640,.78,pz,t);
 s+=badge(1,140,300,ORG,pop(t,4.6));
 // balance bar
 const bal=t<7.35?1:t<8.5?.7:t<9.47?.45:.25;s+=bar(640,300,560,bal,GRN);s+=`<text x="640" y="250" text-anchor="middle" font-size="44" fill="#fff" stroke="${INK}" stroke-width="8" paint-order="stroke">BALANCE</text>`;
 if(t<7.35){s+=`<g transform="translate(760 760) rotate(6) scale(${pop(t,5.8)})"><rect x="-180" y="-300" width="360" height="600" rx="50" fill="${INK}"/><rect x="-156" y="-260" width="312" height="520" rx="30" fill="#fff"/><rect x="-140" y="-120" width="280" height="150" rx="24" fill="${GRN}"/><text y="-30" text-anchor="middle" font-size="64" fill="#fff">+$3,000</text><text y="90" text-anchor="middle" font-size="36" fill="#888">just now</text></g>`;s+=burst(760,640,t,5.8)}
 if(t>=7.35){s+=sneaker(780,700,1.3*pop(t,7.35),-8);s+=burst(780,700,t,7.35,"#fff")}
 if(t>=8.5){s+=plate(760,980,1.1*pop(t,8.5));s+=burst(760,980,t,8.5,"#fff")}
 if(t>=9.47){s+=bubble(640,520,pop(t,9.47),"I deserve it 😎")}
 if(t>=7.35){for(let i=0;i<3;i++){const p=((t-7.35)*1.2+i/3)%1;s+=coin(300+i*120,1000-p*500,.9,p*200)} }
 return s}
function s2(t){let s=`<rect width="1080" height="1920" fill="#3b3130"/>`;
 s+=`<rect width="1080" height="1920" fill="${ORG}" opacity=".18"/>`;
 s+=calendar(760,520,pop(t,10.95),t<11.5?1+Math.floor(lin(t,10.95,11.5)*9):10);
 s+=burst(760,520,t,10.95,RED);
 s+=bar(540,260,700,cl(.25-lin(t,11,12.4)*.25),RED);
 s+=`<text x="540" y="210" text-anchor="middle" font-size="44" fill="#fff">BALANCE: $${Math.round(750*(1-lin(t,11,12.4)))}</text>`;
 s+=man(380,1660,.8,POS.sad,t);
 if(t>12.06)s+=wallet(760,1000,pop(t,12.06)*1.05,true);
 if(t>13.04){const p=lin(t,13.04,14.7);s+=`<text x="760" y="1240" text-anchor="middle" font-size="60" fill="#fff" opacity="${p}">z z z . . .</text>`}
 return s}
function s3(t){let s=bg(TEAL,TEAL2,t);
 s+=badge(2,940,300,TEAL,pop(t,14.7));
 const pz=t<17.93?POS.idle:t<21.77?POS.point:t<25.1?POS.think:POS.cheer;
 s+=man(750,1640,.78,pz,t,true);
 if(t<17.93){s+=card(400,620,1.05*pop(t,15.85),"$3,000",GRN,-3);s+=burst(400,620,t,15.85)}
 else{ // allocation stack
  const a=pop(t,17.93),b=t>21.77?pop(t,21.77):0,c=t>25.1?pop(t,25.1):0;
  s+=piggy(360,620,.95*a,"20%");
  s+=burst(360,620,t,17.93);
  for(let i=0;i<4;i++){const p=lin(t,18.2+i*.5,18.9+i*.5);if(p>0&&p<1)s+=coin(360+(1-p)*400,300+p*230,.8,p*360)}
  if(b>0){s+=bill(260,1060,.9*b,"RENT",-8)+bill(470,1080,.9*b,"BILLS",6)}
  if(c>0){s+=`<g transform="translate(360 1330) scale(${c})"><text text-anchor="middle" font-size="110" fill="${YEL}" stroke="${INK}" stroke-width="12" paint-order="stroke">FUN 🎉</text></g>`;s+=confetti(t,25.1)}
 }
 return s}
function s4(t){let s=`<rect width="540" height="1920" fill="${ORG}"/><rect x="540" width="540" height="1920" fill="${TEAL}"/><path d="M540 0 V1920" stroke="${INK}" stroke-width="14"/>`;
 if(t<29.94){const tags=[["SALARY",26.38],["CITY",27.4],["AGE",28.56]];tags.forEach(([w,a],i)=>{if(t>=a){const k=pop(t,a,.3);s+=`<g transform="translate(540 ${330+i*170}) rotate(${i%2?4:-4}) scale(${k})"><rect x="-300" y="-70" width="600" height="140" rx="24" fill="#fff" stroke="${INK}" stroke-width="10"/><text y="34" text-anchor="middle" font-size="84" fill="${INK}">= ${w}</text></g>`}});
  s+=man(270,1600,.6,POS.idle,t)+man(810,1600,.6,POS.idle,t,true)}
 else{
  // left: pushing a giant coin uphill (works for money)
  const q=t-29.94;s+=`<path d="M0 1500 L540 1150 V1920 H0Z" fill="#c25e00"/>`;
  s+=coin(380,1110+Math.sin(q*6)*6,2.6,q*30);
  s+=man(200,1500,.55,P({lean:28,tilt:10,b:[120,100],f:[110,95],bh:"fist",fh:"fist",lb:[-30,20],lf:[25,-10],ex:{brow:12,mouth:.5}}),t);
  s+=`<text x="270" y="420" text-anchor="middle" font-size="52" fill="#fff" stroke="${INK}" stroke-width="10" paint-order="stroke">WORKS FOR $</text>`;
  if(t>31.55){const g=lin(t,31.55,33.6);s+=`<text x="810" y="420" text-anchor="middle" font-size="52" fill="#fff" stroke="${INK}" stroke-width="10" paint-order="stroke">$ WORKS FOR HIM</text>`;
   let pts=[];for(let i=0;i<=20;i++){const x=600+i*22,y=1250-Math.pow(i/20,2.2)*560*g;pts.push(x+","+y)}
   s+=`<polyline points="${pts.join(" ")}" fill="none" stroke="${YEL}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>`;
   for(let i=0;i<5;i++){const p=((t-31.55)*.9+i/5)%1;s+=coin(640+i*80,1300-p*700,.7*(1-p*.3),p*180)}
   s+=man(810,1680,.5,POS.smug,t,true)} else s+=man(810,1680,.5,POS.idle,t,true);
 }
 return s}
function s5(t){let s=`<rect width="540" height="1920" fill="${ORG}"/><rect x="540" width="540" height="1920" fill="${TEAL}"/><path d="M540 0 V1920" stroke="${INK}" stroke-width="14"/>`;
 if(t<37.09){const pl=1+Math.sin(t*8)*.04;
  s+=badge(1,270,700,ORG,2.0*pop(t,34.1)*pl)+badge(2,810,700,TEAL,2.0*pop(t,34.25)*pl);
  s+=man(270,1600,.55,POS.shrug,t)+man(810,1600,.55,POS.smug,t,true);
  if(t>35.31){s+=`<g transform="translate(540 1050) scale(${pop(t,35.31)})"><rect x="-330" y="-80" width="660" height="160" rx="80" fill="#fff" stroke="${INK}" stroke-width="10"/><text y="34" text-anchor="middle" font-size="80" fill="${INK}">💬 1 or 2 ?</text></g>`}}
 else{s=`<rect width="1080" height="1920" fill="${INK}"/>`+rays(t,"#fff");
  const k=pop(t,37.09);s+=`<g transform="translate(540 520) scale(${k})"><text text-anchor="middle" font-size="150" fill="${YEL}">PART 2</text></g>`;
  if(t>38.03){const k2=pop(t,38.03);s+=`<g transform="translate(540 760) scale(${k2})"><text text-anchor="middle" font-size="90" fill="#fff">10 YEARS LATER...</text></g>`;
   const hg=lin(t,38.5,41.5);s+=`<g transform="translate(540 1180) scale(${k2}) rotate(${Math.sin(t*2)*4})"><path d="M-110 -170 H110 L10 0 L110 170 H-110 L-10 0Z" fill="none" stroke="#fff" stroke-width="12" stroke-linejoin="round"/><path d="M${-80*(1-hg)} ${-140+140*hg} H${80*(1-hg)} L0 -10Z" fill="${YEL}"/><path d="M${-90*hg} 160 H${90*hg} L0 ${160-140*hg}Z" fill="${YEL}"/></g>`;
   s+=man(220,1700,.42,POS.shrug,t)+man(860,1700,.42,POS.smug,t,true)}
 }
 return s}
/* ---------- captions ---------- */
function caption(t){const c=CAP.find(x=>t>=x[0]&&t<x[1]);if(!c)return"";
 const k=pop(t,c[0],.18);const parts=c[2].split("~");let sp="";parts.forEach((p,i)=>{if(p)sp+=`<tspan fill="${i%2?YEL:"#fff"}">${p}</tspan>`});
 const fs=Math.min(92,1560/c[2].replace(/~/g,"").length);
 return `<g transform="translate(540 1780) scale(${k})"><text text-anchor="middle" font-size="${fs}" stroke="${INK}" stroke-width="18" stroke-linejoin="round" paint-order="stroke">${sp}</text></g>`}
function render(t){const sc=SC.find(x=>t>=x[0]&&t<x[1])||SC[SC.length-1];
 const L=t-sc[0],dur=sc[1]-sc[0];
 let zoom=1+.05*(L/dur);let bt=BEATS.filter(b=>b<=t).pop();const pb=t-bt;if(pb<.25)zoom+=.05*(1-pb/.25);
 let sh=pb<.18?(1-pb/.18)*14:0;const sx=Math.sin(t*90)*sh,sy=Math.cos(t*77)*sh;
 let wx=0;if(L<.22&&sc[0]>0)wx=(1-eo(L/.22))*1080*(SC.indexOf(sc)%2?1:-1);
 let s=`<g transform="translate(${540+sx+wx} ${960+sy}) scale(${zoom}) translate(-540 -960)">${sc[2](t)}</g>`;
 if(L<.12&&sc[0]>0)s+=`<rect width="1080" height="1920" fill="#fff" opacity="${1-L/.12}"/>`;
 s+=caption(t);
 document.getElementById("sv").innerHTML=s}
render(0);
</script></body></html>
