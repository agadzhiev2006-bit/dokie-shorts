const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, eo=x=>1-Math.pow(1-clamp(x),3);

/* ---------- Dokie ---------- */
function talkAmp(t){for(const w of WORDS){if(t>=w[0]-.02&&t<=w[1]) return .35+.45*Math.abs(Math.sin(t*19+w[0]*7));} return 0;}
function poseFrom(keys,t){let i=0; keys.forEach((k,j)=>{if(t>=k[0]) i=j;});
  const c=PO[keys[i][1]], pv=i?PO[keys[i-1][1]]:c, p=eio(Pr(t,keys[i][0],keys[i][0]+.28)), m=(a,b)=>lerp(a??0,b??0,p);
  const ex={}; ["lid","brow","brow2","px"].forEach(k=>ex[k]=m(pv.ex[k],c.ex[k]));
  return {name:keys[i][1],lean:m(pv.lean,c.lean),tilt:m(pv.tilt,c.tilt),bob:m(pv.bob,c.bob),b:[m(pv.b[0],c.b[0]),m(pv.b[1],c.b[1])],f:[m(pv.f[0],c.f[0]),m(pv.f[1],c.f[1])],
   fh:p<.5?pv.fh:c.fh,fha:m(pv.fha,c.fha),fhs:m(pv.fhs||1.35,c.fhs||1.35),bh:p<.5?pv.bh:c.bh,bha:m(pv.bha,c.bha),ex};}
/* x,feetY,scale, keys [[t,pose]], o:{flip,talk,col,seed,jitter,look} */
function dokie(t,x,fy,s,keys,o={}){
  const P=poseFrom(keys,t), sd=o.seed||0;
  P.lb=[-12,6]; P.lf=[18,-12];
  P.lean+=Math.sin(t*2.1+sd)*1.4; P.tilt+=Math.sin(t*1.6+sd)*2.5;
  if(P.name==="wag") P.f[1]+=Math.sin(t*20)*12;
  if(P.name==="explain"||P.name==="present"){P.f[0]+=Math.sin(t*2.7+sd)*6;P.f[1]+=Math.sin(t*3.3+sd)*9;}
  if(o.jitter){P.f[1]+=Math.sin(t*14+sd)*14;P.b[1]+=Math.cos(t*12)*14;P.tilt+=Math.sin(t*9)*5;P.bob=(P.bob||0)+Math.abs(Math.sin(t*7))*-10;}
  const amp=o.talk?talkAmp(t):0; P.tilt+=amp*Math.sin(t*8)*4;
  P.ex.blink=((t+.7+sd)%3.3)<.11?1:0; P.ex.mouth=amp; if(o.look) P.ex.look=o.look;
  let s0="";
  if(o.col) s0+=`<ellipse cx="${x}" cy="${fy-330*s}" rx="${330*s}" ry="${430*s}" fill="${o.col}" opacity=".22" filter="url(#bl)"/>`;
  s0+=`<ellipse cx="${x}" cy="${fy+8}" rx="${230*s}" ry="${30*s}" fill="${o.col||"rgba(0,0,0,.5)"}" opacity=".45" filter="url(#bl)"/>`;
  return s0+`<g transform="translate(${x} ${fy}) scale(${o.flip?-s:s} ${s}) translate(-540 -1665)" filter="url(#msh)">${manSVG(P)}</g>`;
}

  let s=`<rect x="-200" y="-200" width="740" height="2400" fill="${RL}"/><rect x="540" y="-200" width="760" height="2400" fill="${BL}"/>`;
  s+=dokie(t,285,1790,.6,[[-9,"shrug"]],{col:RED,jitter:1,seed:1});
  s+=dokie(t,800,1790,.6,[[-9,"explain"]],{col:BLU,flip:1,seed:2});
  // multitasker orbiting icons
  [["phone",0],["mail",2.1],["tv",4.2]].forEach(([k,ph],i)=>{const a=t*2.6+ph; s+=G(285+Math.cos(a)*190,930+Math.sin(a)*70,.62,card(IC[k](RED),RED,180)+badge(i+1),{r:Math.sin(t*5+i)*10});});
  // single-tasker one laptop, steady
  s+=G(800,930+Math.sin(t*2)*8,.75,card(IC.lap(BLU),BLU,200));
  s+=G(285,560,1,pillC("MULTITASKER",440,RED,40)); s+=G(800,560,1,pillC("SINGLE-TASKER",470,BLU,40));
  s+=`<path d="M540,640 L540,1920" stroke="${INK}" stroke-width="8"/>`+G(540,1210,1+.06*Math.sin(t*6),`<circle r="86" fill="${INK}" stroke="#fff" stroke-width="10"/>${TXT(0,26,"VS",76,{c:"#fff",w:900})}`);
  return s;}
